<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POS — Reset password</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#E7EBF1">
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-hero">
      <div class="mark">✦ ✦ ✦</div>
      <h1>Forgot it?</h1>
      <p class="auth-hero-tag">Enter your account email, we'll send a 6-digit code, then you pick a new password.</p>
      <ul class="auth-hero-points">
        <li>Code expires in 10 minutes</li>
        <li>Works the same in the app and the browser</li>
      </ul>
    </div>
    <div class="auth-main">
  <div class="receipt">
    <div class="receipt-head">
      <div class="mark">✦ ✦ ✦</div>
      <h1>RESET PASSWORD</h1>
      <p id="step-label">we'll email you a code</p>
    </div>
    <hr class="rule">
    <div id="status" class="status"></div>

    <form id="forgot-form">
      <div class="field"><label for="email">EMAIL</label><input type="email" id="email" placeholder="you@yourshop.com" required autocomplete="email"></div>
      <button type="submit" class="btn" id="submit-btn">SEND CODE</button>
    </form>

    <form id="reset-form" style="display:none;">
      <div class="field"><label for="otp">6-DIGIT CODE</label><input type="text" id="otp" inputmode="numeric" pattern="\d{6}" maxlength="6" placeholder="••••••" required autocomplete="one-time-code"></div>
      <div class="field"><label for="password">NEW PASSWORD</label><input type="password" id="password" minlength="8" required autocomplete="new-password" placeholder="at least 8 characters"></div>
      <div class="field"><label for="password2">CONFIRM PASSWORD</label><input type="password" id="password2" minlength="8" required autocomplete="new-password"></div>
      <button type="submit" class="btn" id="reset-btn">SAVE PASSWORD</button>
    </form>

    <hr class="rule">
    <p class="foot-line">Remembered it? <a href="/index.html" class="btn-link">Log in</a></p>
  </div>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>
    const forgotForm = document.getElementById("forgot-form");
    const resetForm = document.getElementById("reset-form");
    const statusEl = document.getElementById("status");
    let email = "";

    forgotForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      email = document.getElementById("email").value.trim();
      const btn = document.getElementById("submit-btn");
      btn.disabled = true; btn.textContent = "SENDING...";
      try {
        await apiFetch("/api/auth/forgot-password", { method: "POST", body: JSON.stringify({ email }) });
        showStatus(statusEl, "If that email has an account, a 6-digit code is on its way.", "ok");
        forgotForm.style.display = "none";
        resetForm.style.display = "";
        document.getElementById("step-label").textContent = "enter the code and a new password";
        document.getElementById("otp").focus();
      } catch (err) {
        showStatus(statusEl, err.message, "err");
      } finally {
        btn.disabled = false; btn.textContent = "SEND CODE";
      }
    });

    resetForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = document.getElementById("password").value;
      if (password !== document.getElementById("password2").value) { showStatus(statusEl, "Passwords don't match.", "err"); return; }
      const btn = document.getElementById("reset-btn");
      btn.disabled = true; btn.textContent = "SAVING...";
      try {
        await apiFetch("/api/auth/reset-password", { method: "POST", body: JSON.stringify({ email, code: document.getElementById("otp").value.trim(), password }) });
        showStatus(statusEl, "Password saved. Redirecting to login…", "ok");
        setTimeout(() => (window.location.href = "/index.html"), 1200);
      } catch (err) {
        showStatus(statusEl, err.message, "err");
        btn.disabled = false; btn.textContent = "SAVE PASSWORD";
      }
    });
  </script>
</body>
</html>

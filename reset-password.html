<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POS — Set new password</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#E7EBF1">
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-hero">
      <div class="mark">✦ ✦ ✦</div>
      <h1>Almost there</h1>
      <p class="auth-hero-tag">Pick a new password and you're straight back into the till.</p>
      <ul class="auth-hero-points">
        <li>At least 8 characters</li>
        <li>This link only works once</li>
      </ul>
    </div>
    <div class="auth-main">
  <div class="receipt">
    <div class="receipt-head">
      <div class="mark">✦ ✦ ✦</div>
      <h1>NEW PASSWORD</h1>
      <p>pick something you'll remember</p>
    </div>

    <hr class="rule">

    <div id="status" class="status"></div>

    <form id="reset-form">
      <div class="field">
        <label for="password">NEW PASSWORD</label>
        <input type="password" id="password" name="password" placeholder="at least 8 characters" required minlength="8" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="password2">CONFIRM PASSWORD</label>
        <input type="password" id="password2" name="password2" placeholder="type it again" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="btn" id="submit-btn">SAVE PASSWORD</button>
    </form>

    <hr class="rule">

    <p class="foot-line">
      <a href="/index.html" class="btn-link">Back to login</a>
    </p>
  </div>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    const form = document.getElementById("reset-form");
    const statusEl = document.getElementById("status");
    const btn = document.getElementById("submit-btn");

    if (!token) {
      showStatus(statusEl, "This reset link is missing its token. Request a new one from the login page.", "err");
      form.querySelectorAll("input, button").forEach((el) => (el.disabled = true));
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = document.getElementById("password").value;
      const password2 = document.getElementById("password2").value;
      if (password !== password2) {
        showStatus(statusEl, "Passwords don't match.", "err");
        return;
      }
      btn.disabled = true;
      btn.textContent = "SAVING...";
      try {
        await apiFetch("/api/auth/reset-password", {
          method: "POST",
          body: JSON.stringify({ token, password }),
        });
        showStatus(statusEl, "Password saved. Redirecting to login…", "ok");
        setTimeout(() => (window.location.href = "/index.html"), 1200);
      } catch (e) {
        showStatus(statusEl, e.message, "err");
        btn.disabled = false;
        btn.textContent = "SAVE PASSWORD";
      }
    });
  </script>
</body>
</html>

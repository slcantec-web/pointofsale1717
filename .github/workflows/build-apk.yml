name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["*.html", "*.css", "app.js", "offline.js", "manifest.json", "icons/**", "android-app/**"]

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Copy web app into www/
        run: npm run prepare-web

      - name: Create the Android project
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: pos-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk

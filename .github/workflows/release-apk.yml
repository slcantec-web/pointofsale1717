name: Release Android APK

# Release flow:  git tag v1.0.1 && git push origin v1.0.1
# -> builds a signed APK -> publishes it as a GitHub Release (pos.apk).
# The login page link and the in-app "update available" prompt both read the latest release.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 1.0.1 (a release v<version> is created)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - name: Work out version
        id: ver
        working-directory: .
        run: |
          RAW="${{ github.event.inputs.version || github.ref_name }}"
          VER="${RAW#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Copy web app into www/
        run: npm run prepare-web

      - name: Create the Android project
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/pos-release.jks"

      - name: Set version + signing
        env:
          VERSION_NAME: ${{ steps.ver.outputs.version }}
          KEYSTORE_PATH: ${{ runner.temp }}/pos-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node patch-android.js

      - name: Build signed release APK
        working-directory: android-app/android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/pos-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk pos.apk

      - name: Publish GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" android-app/pos.apk --clobber
          else
            gh release create "$TAG" android-app/pos.apk --title "POS $TAG" --generate-notes --target "${{ github.sha }}"
          fi
